<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SHADOW SENSI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080610;color:white;font-family:Arial}
header{text-align:center;padding:25px;border-bottom:1px solid #632a94}
.logo{font-size:29px;font-weight:900;color:#c17aff;text-shadow:0 0 15px #902cff}
.sub{color:#aaa;font-size:12px;margin-top:7px}
main{max-width:480px;width:92%;margin:25px auto}
.card{background:#151020;border:1px solid #51257c;padding:20px;border-radius:15px;margin-bottom:18px;box-shadow:0 0 15px #7924b322}
h2{color:#c78aff;margin-top:0}
input,select{width:100%;padding:14px;margin:8px 0;background:#090710;border:1px solid #67339b;color:white;border-radius:8px}
button{width:100%;padding:14px;margin-top:10px;border:0;border-radius:8px;background:linear-gradient(90deg,#6921a9,#a64de5);color:white;font-weight:bold}
.secondary{background:#38234d}
.danger{background:#922c43}
.hidden{display:none!important}
.small{color:#aaa;font-size:12px}
.result{background:#0b0811;padding:13px;border:1px solid #51257c;border-radius:9px;margin-top:9px}
.value{font-size:24px;color:#d19aff;font-weight:bold}
#message{color:#d19aff;margin-top:12px}
.keyitem{padding:12px;background:#0a0710;border:1px solid #51257c;border-radius:9px;margin:10px 0;overflow-wrap:anywhere}
.keyitem button{width:auto;padding:9px}
</style>
</head>
<body>

<header>
<div class="logo">SHADOW SENSI</div>
<div class="sub">FREE FIRE • SENSITIVITY SYSTEM</div>
</header>

<main>

<section class="card" id="login">
<h2>🔐 ACESSO POR KEY</h2>
<p class="small">Digite sua Key para acessar o sistema.</p>
<input id="keyInput" placeholder="SHADOW-XXXXXXXX">
<button onclick="loginKey()">ENTRAR</button>
<div id="message"></div>
</section>

<section id="app" class="hidden">

<div class="card">
<h2>🎯 GERADOR DE SENSI</h2>

<label>Escolha seu estilo</label>
<select id="style">
<option value="balance">Balanceada</option>
<option value="rush">Rush</option>
<option value="precision">Precisão</option>
<option value="capa">Capa</option>
</select>

<label>Seu celular</label>
<select id="device">
<option value="basic">Básico</option>
<option value="medium">Intermediário</option>
<option value="advanced">Avançado</option>
</select>

<button onclick="generate()">GERAR SENSIBILIDADE</button>

<div id="results" class="hidden">
<div class="result">Geral <div class="value" id="geral"></div></div>
<div class="result">Ponto vermelho <div class="value" id="red"></div></div>
<div class="result">Mira 2x <div class="value" id="x2"></div></div>
<div class="result">Mira 4x <div class="value" id="x4"></div></div>
<div class="result">AWM <div class="value" id="awm"></div></div>
<div class="result">Olhadinha <div class="value" id="look"></div></div>
<button class="secondary" onclick="copySensi()">COPIAR SENSI</button>
</div>
</div>

<div class="card">
<h2>⏳ TEMPO DA KEY</h2>
<div id="timer" class="value">Carregando...</div>
<p class="small">O tempo começa no primeiro acesso.</p>
</div>

</section>

<div class="card">
<h2>⚙️ PAINEL ADMINISTRATIVO</h2>

<div id="adminLogin">
<input id="adminPassword" type="password" placeholder="Senha administrativa">
<button onclick="adminEnter()">ENTRAR NO ADMIN</button>
</div>

<div id="adminPanel" class="hidden">
<h2>CRIAR KEY</h2>

<select id="duration">
<option value="1">1 hora</option>
<option value="24">1 dia</option>
<option value="168">7 dias</option>
<option value="720">30 dias</option>
</select>

<button onclick="createKey()">GERAR KEY</button>

<div id="newKey" class="result hidden"></div>

<h2>GERENCIAR KEYS</h2>
<button class="secondary" onclick="loadKeys()">ATUALIZAR</button>
<div id="keyList"></div>

<button class="danger" onclick="adminExit()">SAIR DO ADMIN</button>
</div>
</div>

</main>

<script>
const $=id=>document.getElementById(id);

let currentKey="";
let adminToken="";
let timerInterval=null;
let values={};

async function api(url,options={}){
 const r=await fetch(url,{
  ...options,
  headers:{
   "Content-Type":"application/json",
   ...(options.headers||{})
  }
 });
 const d=await r.json();
 if(!r.ok)throw Error(d.error||"Erro");
 return d;
}

async function loginKey(){
 const key=$("keyInput").value.trim();
 $("message").textContent="Verificando Key...";

 try{
  const d=await api("/api/login-key",{
   method:"POST",
   body:JSON.stringify({key})
  });

  currentKey=key;
  $("login").classList.add("hidden");
  $("app").classList.remove("hidden");
  $("message").textContent="";

  updateTimer(d.remaining);
  clearInterval(timerInterval);
  timerInterval=setInterval(checkKey,1000);

 }catch(e){
  $("message").textContent=e.message;
 }
}

function updateTimer(ms){
 if(ms===null){
  $("timer").textContent="Aguardando";
  return;
 }

 let s=Math.max(0,Math.floor(ms/1000));
 const d=Math.floor(s/86400);
 const h=Math.floor(s%86400/3600);
 const m=Math.floor(s%3600/60);
 const sec=s%60;

 $("timer").textContent=
 `${d}d ${h}h ${m}m ${sec}s`;
}

async function checkKey(){
 try{
  const d=await api("/api/check-key",{
   method:"POST",
   body:JSON.stringify({key:currentKey})
  });

  if(!d.active){
   clearInterval(timerInterval);
   $("app").classList.add("hidden");
   $("login").classList.remove("hidden");
   $("message").textContent="Key expirada ou bloqueada.";
   currentKey="";
   return;
  }

  updateTimer(d.remaining);

 }catch(e){}
}

function generate(){
 const style=$("style").value;
 const device=$("device").value;

 const ranges={
  balance:[155,180],
  rush:[175,200],
  precision:[125,160],
  capa:[165,195]
 };

 const [min,max]=ranges[style];
 const base=Math.floor(Math.random()*(max-min+1))+min;

 const adjustment={
  basic:-8,
  medium:0,
  advanced:3
 }[device];

 const random=(a,b)=>Math.max(0,Math.min(200,
  Math.floor(Math.random()*(b-a+1))+a+adjustment
 ));

 values={
  Geral:Math.min(200,base+adjustment),
  "Ponto vermelho":random(base-15,base),
  "Mira 2x":random(base-30,base-15),
  "Mira 4x":random(base-45,base-25),
  AWM:random(35,85),
  Olhadinha:random(90,130)
 };

 $("geral").textContent=values.Geral;
 $("red").textContent=values["Ponto vermelho"];
 $("x2").textContent=values["Mira 2x"];
 $("x4").textContent=values["Mira 4x"];
 $("awm").textContent=values.AWM;
 $("look").textContent=values.Olhadinha;

 $("results").classList.remove("hidden");
}

function copySensi(){
 const text=Object.entries(values)
  .map(([k,v])=>k+": "+v).join("\n");

 if(navigator.clipboard){
  navigator.clipboard.writeText(text)
   .then(()=>alert("Sensi copiada!"))
   .catch(()=>alert(text));
 }else{
  alert(text);
 }
}

async function adminEnter(){
 try{
  const d=await api("/api/admin/login",{
   method:"POST",
   body:JSON.stringify({
    password:$("adminPassword").value
   })
  });

  adminToken=d.token;

  $("adminLogin").classList.add("hidden");
  $("adminPanel").classList.remove("hidden");
  $("adminPassword").value="";

  await loadKeys();

 }catch(e){
  alert(e.message);
 }
}

async function adminApi(url,options={}){
 return api(url,{
  ...options,
  headers:{
   Authorization:"Bearer "+adminToken,
   ...(options.headers||{})
  }
 });
}

async function createKey(){
 try{
  const d=await adminApi("/api/admin/keys",{
   method:"POST",
   body:JSON.stringify({
    hours:Number($("duration").value)
   })
  });

  $("newKey").textContent="NOVA KEY: "+d.code;
  $("newKey").classList.remove("hidden");

  if(navigator.clipboard){
   await navigator.clipboard.writeText(d.code).catch(()=>{});
  }

  await loadKeys();

 }catch(e){
  alert(e.message);
 }
}

async function loadKeys(){
 try{
  const keys=await adminApi("/api/admin/keys");

  $("keyList").innerHTML="";

  keys.forEach(k=>{
   const expired=k.activatedAt &&
    Date.now()>=k.activatedAt+k.duration*3600000;

   const div=document.createElement("div");
   div.className="keyitem";

   const title=document.createElement("b");
   title.textContent="KEY "+k.id.slice(0,8);

   const info=document.createElement("p");
   info.className="small";
   info.textContent=
    (k.blocked?"BLOQUEADA":
    expired?"EXPIRADA":
    k.activatedAt?"ATIVA":"AGUARDANDO USO")+
    " • "+(k.duration/24)+" dia(s)";

   const block=document.createElement("button");
   block.className="secondary";
   block.textContent=k.blocked?"DESBLOQUEAR":"BLOQUEAR";
   block.onclick=()=>changeBlock(k.id);

   const del=document.createElement("button");
   del.className="danger";
   del.textContent="EXCLUIR";
   del.onclick=()=>deleteKey(k.id);

   div.append(title,info,block,del);
   $("keyList").appendChild(div);
  });

 }catch(e){
  alert(e.message);
 }
}

async function changeBlock(id){
 try{
  await adminApi("/api/admin/keys/"+id+"/block",{
   method:"POST"
  });
  await loadKeys();
 }catch(e){alert(e.message);}
}

async function deleteKey(id){
 if(!confirm("Deseja excluir esta Key?"))return;

 try{
  await adminApi("/api/admin/keys/"+id,{
   method:"DELETE"
  });
  await loadKeys();
 }catch(e){alert(e.message);}
}

function adminExit(){
 adminToken="";
 $("adminPanel").classList.add("hidden");
 $("adminLogin").classList.remove("hidden");
}
</script>

</body>
  </html>
